<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfcfb">
  <link rel="icon" href="data:,">
  <title>Funder dashboard for W3C specs</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header"><h1>Funder dashboard for W3C specs</h1></header>
    <form id="add-spec" class="input-row">
      <label class="spec-input">W3C shortname<input id="shortname" name="shortname" placeholder="webauthn-3" autocomplete="off" required list="spec-shortnames"></label>
      <button type="submit" class="add-button">Add card</button>
      <label class="token-input">GitHub token (optional, kept in this tab)<input id="github-token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-note"></label>
      <button type="button" id="walk-through" class="walk-button" aria-pressed="false" aria-controls="walkthrough-banner">Walk through</button>
      <span id="token-note" class="visually-hidden">Stored in this tab's session only. Updating the token refreshes GitHub data.</span>
    </form>
    <datalist id="spec-shortnames"></datalist>
    <p id="page-message" class="page-message" role="status"></p>
    <div id="cards" class="cards" aria-label="Specification cards"></div>
    <footer class="page-footer"><a href="https://tarakiyee.github.io/funder-guide-draft/draft-tarakiyee-funder-guide.html">Based on draft-tarakiyee-funder-guide</a><button id="export-cache" type="button" class="quiet-button">Export cache</button></footer>
  </main>
  <div id="walkthrough-overlay" class="walkthrough-overlay" aria-hidden="true"></div>
  <aside id="walkthrough-banner" class="walkthrough-banner" aria-label="Funder guide walkthrough" hidden>
    <div class="walkthrough-copy" aria-live="polite" aria-atomic="true">
      <p id="walkthrough-step-label"></p>
      <p id="walkthrough-guide"></p>
      <p id="walkthrough-fact"></p>
    </div>
    <div class="walkthrough-nav">
      <div id="walkthrough-dots" class="walkthrough-dots" aria-label="Walkthrough steps"></div>
    <div class="walkthrough-controls">
      <button type="button" id="walkthrough-next">Next</button>
      <button type="button" id="walkthrough-done">Done</button>
    </div>
    </div>
  </aside>
</body>
</html>
